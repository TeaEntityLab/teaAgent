name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine git-cliff

      - name: Generate changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/release-changelog.sh "$VERSION"

      - name: Run release eval gate
        run: |
          mkdir -p dist/evidence
          python scripts/run_release_eval_gate.py --root . --report dist/evidence/release-eval-gate.json

      - name: Build release evidence bundle
        # The script takes --output/--profile (not --output-dir); counts-only keeps
        # the tag build fast and matches the release checklist's pre-tag profile.
        run: |
          mkdir -p dist/evidence
          python scripts/build_release_evidence_bundle.py --profile counts-only --output dist/evidence/release-evidence.json

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: teaagent-dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Owner decision 2026-10-09: a v* tag builds and attests but does not publish;
    # publishing to PyPI is a manual workflow_dispatch step.
    if: github.event_name == 'workflow_dispatch'
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: teaagent-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  attest:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: teaagent-dist
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
