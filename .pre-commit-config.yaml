repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        pass_filenames: false
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix --exit-non-zero-on-fix .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy teaagent/
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
