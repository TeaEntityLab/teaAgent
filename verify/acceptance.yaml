# LOCKED acceptance oracle for the TeaAgent verification map.
# Authoritative oracle (verify/governance/contracts.yaml oracle_manifest): verifiers and
# refresh loops never edit this file. A mismatch between this file and a healthy product
# is a spec/oracle error — propose the change for owner review; do not patch in-run.
# Runner: verify/checks/acceptance.sh (each check runs in a fresh scratch workspace with
# $T teaagent, $P venv python, $FIX fixtures, and the lib.sh helpers; exit 0 = holds).
# status: expected_pass | known_failing (with finding id; a pass then reports XPASS).
version: 1
source_commit: a91f1dc2
checks:
  - id: A1-destructive-needs-approval
    invariant: "AGENTS.md Tool Governance: in read-only and prompt modes a destructive tool does not run without an approval for that exact call"
    status: expected_pass
    run: |
      for mode in read-only prompt; do
        rc=0; TEAAGENT_FAKE_SCRIPT="$FIX/write-probe.json" "$T" run fake "write probe" --root . --permission-mode "$mode" --json --no-summary > out.json 2> /dev/null || rc=$?
        [ "$rc" = 1 ]
        [ ! -e probe.txt ]
      done
      jget 'd["audit_summary"]["status"]' < out.json | grep -qx pending_approval

  - id: A2-scoped-approval-is-exact
    invariant: "AGENTS.md Tool Governance: an approval token authorizes exactly one tool+arguments payload"
    status: expected_pass
    run: |
      other=$("$P" -c "from teaagent.policy import compute_scoped_payload_digest as c; print(c('workspace_write_file', {'path': 'probe.txt', 'content': 'y'}))")
      TEAAGENT_FAKE_SCRIPT="$FIX/write-probe.json" "$T" run fake "write probe" --root . --permission-mode prompt --approve-scoped "workspace_write_file:$other" --json --no-summary > /dev/null 2>&1 || true
      [ ! -e probe.txt ]
      exact=$("$P" -c "from teaagent.policy import compute_scoped_payload_digest as c; print(c('workspace_write_file', {'path': 'probe.txt', 'content': 'x'}))")
      TEAAGENT_FAKE_SCRIPT="$FIX/write-probe.json" "$T" run fake "write probe" --root . --permission-mode prompt --approve-scoped "workspace_write_file:$exact" --json --no-summary > /dev/null 2>&1
      [ "$(cat probe.txt)" = x ]

  - id: A3-run-caps-enforced
    invariant: "AGENTS.md Runtime Safety: every run has an iteration limit and a tool-call limit"
    status: expected_pass
    run: |
      rc=0; TEAAGENT_FAKE_SCRIPT="$FIX/four-reads.json" "$T" run fake "list" --root . --permission-mode read-only --max-tool-calls 2 --json --no-summary > out.json 2> /dev/null || rc=$?
      [ "$rc" = 1 ]
      jget 'd["audit_summary"]["event_counts"]["tool_call_completed"]' < out.json | grep -qx 2
      rc=0; TEAAGENT_FAKE_SCRIPT="$FIX/four-reads.json" "$T" run fake "list" --root . --permission-mode read-only --max-iterations 2 --json --no-summary > out.json 2> /dev/null || rc=$?
      [ "$rc" = 1 ]
      jget 'd["iterations"] <= 2' < out.json | grep -qx True

  - id: A4-audit-tamper-evident
    invariant: "AGENTS.md Runtime Safety: every tool call and final result is recorded; the hash chain detects modification"
    status: expected_pass
    run: |
      TEAAGENT_FAKE_SCRIPT="$FIX/write-probe.json" "$T" run fake "write probe" --root . --permission-mode workspace-write --skip-plan-check --json --no-summary > out.json 2> /dev/null
      id=$(jget 'd["run_id"]' < out.json)
      grep -q '"event_type": "tool_call_completed"' ".teaagent/runs/$id.jsonl"
      grep -q '"event_type": "run_completed"' ".teaagent/runs/$id.jsonl"
      "$T" audit verify "$id" --root . --ci | jget 'd["status"]' | grep -qx valid
      sed 's/"probe.txt"/"other.txt"/' ".teaagent/runs/$id.jsonl" > tampered.jsonl
      rc=0; "$T" audit verify --path tampered.jsonl --root . --ci > /dev/null 2>&1 || rc=$?
      [ "$rc" = 1 ]

  - id: A5-mcp-destructive-call-governed
    invariant: "AGENTS.md Tool Governance: side effects route through ApprovalPolicy; direct ToolRegistry.execute() without policy context is unsupported (docs/api/mcp-api.md Trust Model)"
    status: known_failing
    finding: F-1
    run: |
      printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"workspace_write_file","arguments":{"path":"mcp.txt","content":"y"}}}' \
        | "$T" mcp serve --root . > frame.json 2> /dev/null
      jget '"error" in d or d["result"]["isError"]' < frame.json | grep -qx True || { echo "destructive tools/call was not refused: $(cat frame.json)"; exit 1; }
      [ ! -e mcp.txt ] || { echo "mcp.txt written by an unapproved tools/call"; exit 1; }

  - id: A6-audit-redacts-sensitive-arguments
    invariant: "audit level L2 (default) stores sensitive tool arguments (teaagent.audit.SENSITIVE_ARGUMENT_KEYS) redacted in every event"
    status: known_failing
    finding: F-2
    run: |
      TEAAGENT_FAKE_SCRIPT="$FIX/write-probe.json" "$T" run fake "write probe" --root . --permission-mode workspace-write --skip-plan-check --json --no-summary > out.json 2> /dev/null
      "$P" - ".teaagent/runs/$(jget 'd["run_id"]' < out.json).jsonl" <<'PY'
      import json, sys
      from teaagent.audit import SENSITIVE_ARGUMENT_KEYS
      def leaks(node):
          if isinstance(node, dict):
              return any((k in SENSITIVE_ARGUMENT_KEYS and v == 'x') or leaks(v) for k, v in node.items())
          if isinstance(node, list):
              return any(leaks(v) for v in node)
          return False
      events = [json.loads(line) for line in open(sys.argv[1])]
      bad = sorted({e['event_type'] for e in events if leaks(e.get('payload'))})
      assert not bad, f'raw sensitive argument in: {bad}'
      PY
